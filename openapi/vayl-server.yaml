  /v1/tools/set_reconcile_policy:
    post:
      tags:
      - Safety and approval
      operationId: set_reconcile_policy
      summary: Configure how a shared space reconciles conflicting sources
      description: "Configure how a SHARED space resolves conflicts between DIFFERENT contributors (sources).\n\
        A shared space is any space (e.g. user_id='org:acme') that multiple agents/people write to with\na `source`\
        \ on each remember. Modes:\n  • RECENCY   — newer assertion wins (default; contributors equally trusted).\n\
        \  • AUTHORITY — a higher-ranked source wins; a lower-ranked source contradicting it is FLAGGED,\n     \
        \           not overwritten. Pass `authority` as {source: rank} (higher = more authoritative).\n  • REVIEW\
        \    — any cross-source conflict is FLAGGED for a human.\nA source correcting its OWN earlier fact always\
        \ supersedes, regardless of mode.\n\n**Requires capability:** `admin`.\nThe same tool over MCP is `tools/call`\
        \ with `\"name\": \"set_reconcile_policy\"`."
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                mode:
                  default: RECENCY
                  type: string
                authority:
                  anyOf:
                  - additionalProperties: true
                    type: object
                  - type: 'null'
                  default: null
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
              type: object
            example:
              mode: AUTHORITY
              authority:
                pharmacy: 3
                clinician: 2
                ehr: 1
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: 'Reconciliation policy for this space set to AUTHORITY.  authority ranks: {''pharmacy'':
                  3, ''clinician'': 2, ''ehr'': 1}'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
