  /v1/tools/check_before_act:
    post:
      tags:
      - Safety and approval
      operationId: check_before_act
      summary: Safety check before acting on a fact
      description: 'Ask whether it''s SAFE to take an autonomous action based on what memory knows about `subject`.

        Returns SAFE, or BLOCKED with explicit reasons — an unresolved conflict, confidence below the bar,

        a value that''s gone stale, or one that just changed. Call this before any irreversible action

        (a payment, an email, a config change) so the agent never silently acts on bad memory. Tune the

        policy via the params (e.g. min_confidence=0.9, max_staleness_days=90 for high-stakes actions).


        **Requires capability:** `read`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "check_before_act"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                subject:
                  type: string
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
                min_confidence:
                  default: 0.7
                  type: number
                require_active:
                  default: true
                  type: boolean
                block_on_flagged:
                  default: true
                  type: boolean
                max_staleness_days:
                  default: 0
                  type: number
                block_on_recent_change_days:
                  default: 0
                  type: number
              required:
              - subject
              type: object
            example:
              subject: active_medication
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: "✅ SAFE to act on 'active_medication'.\n  current: active_medication = apixaban 5 mg twice\
                  \ daily"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/safe_recall:
    post:
      tags:
      - Safety and approval
      operationId: safe_recall
      summary: Gated recall — answers only if safe to act on
      description: 'Like `recall`, but for when the agent will ACT on the answer. It answers only if every current

        fact behind the answer passes the safety policy; otherwise it withholds the answer and returns the

        reasons (disputed value, low confidence, stale, or nothing current). Use this instead of `recall`

        on the path to an irreversible action.


        `critical_categories` behaves as in `recall`, and matters more here: this gate can only judge

        the facts it was handed, so a critical fact ranked out of context would be invisible to the

        check as well — it would pass, on an answer it never knew was incomplete.


        **Requires capability:** `read`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "safe_recall"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                question:
                  type: string
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
                min_confidence:
                  default: 0.7
                  type: number
                require_active:
                  default: true
                  type: boolean
                block_on_flagged:
                  default: true
                  type: boolean
                max_staleness_days:
                  default: 0
                  type: number
                block_on_recent_change_days:
                  default: 0
                  type: number
                critical_categories:
                  default: ''
                  type: string
              required:
              - question
              type: object
            example:
              question: Can we give amoxicillin?
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: No—penicillin causes hives, and amoxicillin is a penicillin antibiotic.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
