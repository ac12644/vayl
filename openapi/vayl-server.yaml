# Generated by openapi/generate.py from openapi/base.yaml, the live tool registry and
# openapi/examples.json. Don't edit by hand: change those, then rerun the script.
openapi: 3.1.0
info:
  title: Vayl HTTP API
  version: 0.10.0
  summary: The routes served by vayl-server, the authenticated team transport for Vayl.
  description: "`vayl-server` serves Vayl's 32 tools two ways, with the same authentication and checks:\n\n- **REST:**\
    \ `POST /v1/tools/{name}` with the tool's arguments as a JSON object, returning\n  `{\"result\": \"...\"}`.\
    \ One operation per tool below. `GET /v1/tools` lists them with their schemas.\n- **MCP:** JSON-RPC 2.0 over\
    \ the Model Context Protocol's streamable HTTP transport at `POST /mcp`,\n  for MCP clients and agent frameworks.\n\
    \nIt also serves unauthenticated health probes and a Prometheus endpoint.\n\n- **Auth:** every `/mcp` request\
    \ needs `Authorization: Bearer <credential>`, either an API key\n  (`vayl_sk_…`, created with the `create_principal`\
    \ tool) or, with an Enterprise license granting\n  `sso`, an OIDC ID token from your identity provider.\n- **TLS:**\
    \ `vayl-server` speaks plain HTTP. Terminate TLS at a reverse proxy or ingress.\n- **Limits:** request bodies\
    \ are capped at `VAYL_MAX_BODY` (default 1 MiB) and each client IP is\n  limited to `VAYL_RATE_PER_MIN` requests\
    \ per minute (default 120, per process; `0` disables it).\n- **Request IDs:** every response carries `X-Request-ID`.\
    \ A plain incoming `X-Request-ID`\n  (1–64 characters of `A-Z a-z 0-9 . _ : -`) is reused; otherwise one is\
    \ generated.\n"
  license:
    name: Apache-2.0
    url: https://github.com/ac12644/vayl/blob/main/LICENSE
externalDocs:
  description: Vayl documentation
  url: https://vayl.gitbook.io/vayl-docs/documentation
servers:
- url: http://127.0.0.1:8080
  description: Default bind address (VAYL_HOST / VAYL_PORT). Put TLS in front for anything but local use.
tags:
- name: Tools
  description: Discover the tools over REST.
- name: MCP
  description: The Model Context Protocol endpoint your agents connect to.
- name: Health
  description: Unauthenticated liveness and readiness probes for load balancers and Kubernetes.
- name: Monitoring
  description: Prometheus metrics.
- name: Memory
  description: Store, query, correct and retract facts, and read their history.
- name: Safety and approval
  description: Check a fact before acting on it, and approve or reject gated changes.
- name: Accountability
  description: Signed decisions, attestations and receipts, and the tamper-evident audit log.
- name: Compliance
  description: Erasure, export and retention for GDPR, with signed receipts.
- name: Administration
  description: API keys and principals, the license, metrics and health checks.
paths:
  /mcp:
    post:
      tags:
      - MCP
      operationId: mcp
      summary: Send an MCP JSON-RPC request
      description: 'Sends one JSON-RPC 2.0 message over MCP streamable HTTP. The server is **stateless**: no

        session ID is issued, so every request stands alone.


        Common methods: `initialize`, `tools/list` (returns the 32 Vayl tools with their JSON Schemas

        and annotations), and `tools/call` (runs one tool). The response is a server-sent-events

        stream whose `data:` line carries the JSON-RPC response.


        A tool that is denied or fails still returns HTTP 200: the result text says

        `Access denied: …` or `Vayl couldn''t complete that (ref …)`. Find the ref in the server log

        next to the same `X-Request-ID`.

        '
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: Accept
        in: header
        required: true
        description: Must accept both JSON and server-sent events, or the server answers 406.
        schema:
          type: string
          example: application/json, text/event-stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              initialize:
                summary: initialize
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: '2025-06-18'
                    capabilities: {}
                    clientInfo:
                      name: curl
                      version: '1'
              toolsList:
                summary: tools/list
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/list
              toolsCall:
                summary: tools/call (license_status)
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: license_status
                    arguments: {}
              remember:
                summary: tools/call (remember)
                value:
                  jsonrpc: '2.0'
                  id: 4
                  method: tools/call
                  params:
                    name: remember
                    arguments:
                      text: Warfarin stopped today. Started apixaban 5 mg twice daily.
                      user_id: pt_4471
      responses:
        '200':
          description: 'A server-sent-events stream. Its `data:` line is the JSON-RPC response. Captured from

            vayl-server 0.10.0.

            '
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                initialize:
                  summary: initialize
                  value: 'data: {"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2025-06-18", "capabilities":{"logging":{},"prompts":{"listChanged":true},
                    "resources":{"subscribe":false,"listChanged":true},"tools":{"listChanged":true}}, "serverInfo":{"name":"vayl","version":"0.10.0"},
                    "instructions":"Vayl is persistent, reconciling memory. When the user asks you to remember,
                    note or keep track of something, or states a fact or a change to one (a decision, a preference,
                    a dose, an account setting, ''we switched to X''), call `remember` with one plain sentence:
                    Vayl retires the old value instead of keeping both, which a notes file cannot do. Before answering
                    from what you were told earlier (a project''s stack, a customer''s plan, a patient''s current
                    medication), call `recall`, with include_history=true for ''what was it before?''. Use `forget`
                    when something is no longer true and has no replacement. If recall doesn''t know, say so instead
                    of guessing."}}'
                toolsCall:
                  summary: tools/call (license_status)
                  value: 'data: {"jsonrpc":"2.0","id":3,"result":{"content":[{"type":"text", "text":"Community edition
                    — up to 3 principals. No license installed.\n principals in use: 1 / 3"}],"isError":false}}'
        '401':
          description: No credential, or one that doesn't resolve to an active principal.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'unauthorized: send Authorization: Bearer vayl_sk_...'
        '403':
          description: The `Origin` header isn't in `VAYL_ALLOWED_ORIGINS` (DNS-rebinding protection).
        '406':
          description: The `Accept` header doesn't include both `application/json` and `text/event-stream`.
        '413':
          description: The body is larger than `VAYL_MAX_BODY`, whether declared or chunked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: request body too large
        '421':
          description: The `Host` header isn't in `VAYL_ALLOWED_HOSTS`. Set it to your public host behind a proxy.
        '429':
          description: This client IP exceeded `VAYL_RATE_PER_MIN` in the last minute (per server process).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: rate limit exceeded
  /healthz:
    get:
      tags:
      - Health
      operationId: healthz
      summary: Liveness probe
      description: Returns 200 while the process is serving. Unauthenticated.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok
  /readyz:
    get:
      tags:
      - Health
      operationId: readyz
      summary: Readiness probe
      description: Runs `SELECT 1` against the database. Unauthenticated, and returns no error detail.
      security: []
      responses:
        '200':
          description: The database answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ready
              example:
                status: ready
        '503':
          description: The database did not answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: not-ready
              example:
                status: not-ready
  /metrics:
    get:
      tags:
      - Monitoring
      operationId: metrics
      summary: Prometheus metrics
      description: 'Counters in Prometheus text format. Contains no memory content, but reveals usage volume and

        the number of active principals: keep it on an internal network, or set `VAYL_METRICS_TOKEN`

        to require that bearer token (compared in constant time).


        Metrics: `vayl_tool_calls_total{tool}`, `vayl_tool_errors_total{tool}`,

        `vayl_tool_latency_avg_ms{tool}`, `vayl_action_total{action}`, `vayl_principals_active`,

        `vayl_license_edition_info{edition}`.

        '
      security:
      - {}
      - metricsToken: []
      responses:
        '200':
          description: Metrics in Prometheus text exposition format 0.0.4.
          content:
            text/plain:
              schema:
                type: string
              example: '# TYPE vayl_tool_calls_total counter

                # TYPE vayl_tool_errors_total counter

                # TYPE vayl_tool_latency_avg_ms gauge

                # TYPE vayl_action_total counter

                # TYPE vayl_principals_active gauge

                vayl_tool_calls_total{tool="remember"} 12

                vayl_tool_errors_total{tool="remember"} 0

                vayl_tool_latency_avg_ms{tool="remember"} 41.2

                vayl_action_total{action="SUPERSEDE"} 3

                vayl_principals_active 2

                vayl_license_edition_info{edition="community"} 1

                '
        '401':
          description: '`VAYL_METRICS_TOKEN` is set and the request did not send it.'
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            text/plain:
              schema:
                type: string
              example: unauthorized
  /v1/tools:
    get:
      tags:
      - Tools
      operationId: listTools
      summary: List the tools
      description: 'Every tool with its title, description and JSON Schema for its arguments: the same list as MCP
        `tools/list`, sorted by name.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: The tools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolList'
              example:
                tools:
                - name: remember
                  title: Remember (extract & reconcile facts)
                  description: Store fact(s) from a statement. …
                  input_schema:
                    type: object
                    required:
                    - text
                    properties:
                      text:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/tools/remember:
    post:
      tags:
      - Memory
      operationId: remember
      summary: Remember (extract & reconcile facts)
      description: 'Store fact(s) from a statement. Reconciles automatically: a new value SUPERSEDES the old

        one (not appended), removals are RETRACTED, and multiple facts in one message are all captured.

        Optional `metadata` tags the facts stored in this call. `source` records WHO/WHAT asserted the

        fact (an agent id, a person, a connector) — belief provenance, and the basis for source-aware

        reconciliation in a shared space (see set_reconcile_policy). Examples: ''We switched from Zustand

        to Redux Toolkit'', ''Alice is the new team lead''.


        **Requires capability:** `write`.

        The same tool over MCP is `tools/call` with `"name": "remember"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                text:
                  type: string
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
                metadata:
                  anyOf:
                  - additionalProperties: true
                    type: object
                  - type: 'null'
                  default: null
                source:
                  default: ''
                  type: string
              required:
              - text
              type: object
            example:
              text: Patient is on warfarin 5 mg daily for atrial fibrillation.
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: 'Stored: [ADD] active_medication = warfarin 5 mg daily; [ADD] primary_diagnosis = atrial
                  fibrillation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/recall:
    post:
      tags:
      - Memory
      operationId: recall
      summary: Recall from current memory
      description: 'Answer a question from CURRENT memory — the active value (''what state library do we use?'')

        or a multi-hop question over current facts. Returns ''I don''t know'' rather than guessing, and

        NEVER answers from a retired/retracted fact. For the timeline of a subject, use `history`.


        Set `include_history=True` ONLY for questions explicitly about the past — ''what did we use

        before?'', ''when did we switch?'' — where retired facts are the answer. It is off by default

        because with it off, superseded values are never loaded at all, so a stale value cannot be

        returned as current regardless of how the model behaves. Leaving it off is the guarantee;

        turning it on trades that for reach into the timeline.


        `critical_categories` (comma-separated) names fact categories that must ALWAYS reach the

        answer regardless of ranking — ''allergy,active_medication'' in a clinical deployment. Ordinary

        recall is semantic top-k, so a fact that does not rank is invisible, not merely deprioritised;

        for some categories that is a safety failure rather than a quality one. Leave empty to use the

        deployment-wide VAYL_CRITICAL_CATEGORIES; an empty value never means ''none''.


        Set `explain=True` to also get the PROVENANCE — the exact facts used to answer, each with who

        asserted it, its confidence, and what it superseded. That''s the truthful basis for an audit of

        why the agent believes what it does (and it''s what `record_decision` snapshots).


        **Requires capability:** `read`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "recall"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                question:
                  type: string
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
                explain:
                  default: false
                  type: boolean
                include_history:
                  default: false
                  type: boolean
                critical_categories:
                  default: ''
                  type: string
              required:
              - question
              type: object
            example:
              question: What anticoagulant is the patient on?
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: The patient is on apixaban 5 mg twice daily.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/recall_related:
    post:
      tags:
      - Memory
      operationId: recall_related
      summary: Recall (relational / graph)
      description: 'Answer a DEEP / RELATIONAL / multi-hop question using the entity graph

        (''who owns the company Bob works for?'', ''which services depend on the auth module?'').

        Uses the Neo4j graph projection when configured; otherwise falls back to slot recall.


        **Requires capability:** `read`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "recall_related"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                question:
                  type: string
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
              required:
              - question
              type: object
            example:
              question: Who is responsible for this patient's care?
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: I don’t know who is responsible for this patient’s care.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/forget:
    post:
      tags:
      - Memory
      operationId: forget
      summary: Forget / retract (kept in history for audit)
      description: 'Retract a fact — a removal with no replacement. Unlike additive stores, this actually

        retires it so it stops being returned as current (kept in history for audit). Examples:

        ''We dropped Sentry'', ''Alice left the Platform team'', ''we no longer support IE11''.


        **Requires capability:** `write`.

        The same tool over MCP is `tools/call` with `"name": "forget"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                text:
                  type: string
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
              required:
              - text
              type: object
            example:
              text: Dr. Lindqvist is no longer on this patient's care team.
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: 'Retracted (retained in history for audit): care_team_lead = Dr. Lindqvist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/history:
    post:
      tags:
      - Memory
      operationId: history
      summary: Change history for a subject
      description: 'The change-log for a subject — every value it has held, oldest → newest, with status.

        The ''what did we use first vs now'' view that additive stores can''t give you. The `subject`

        is the key shown by `list_memories`.


        **Requires capability:** `read`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "history"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                subject:
                  type: string
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
              required:
              - subject
              type: object
            example:
              subject: active_medication
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: "History for 'active_medication' (oldest → newest):\n  1. warfarin 5 mg daily  [SUPERSEDED]\n\
                  \  2. apixaban 5 mg twice daily  [ACTIVE]\n  3. warfarin 5 mg daily  [HISTORICAL]"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/list_memories:
    post:
      tags:
      - Memory
      operationId: list_memories
      summary: List current memories
      description: 'List the current active facts (the reconciled current beliefs) for a user, plus a history

        block of what was superseded / retracted / archived. Active rows show the `#id` for get/update.


        **Requires capability:** `read`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "list_memories"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
              type: object
            example:
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: "• primary_diagnosis = atrial fibrillation  (#2)\n• allergy = penicillin, causes hives \
                  \ (#3)\n• active_medication = apixaban 5 mg twice daily  (#4)\n\n— history (superseded / retracted\
                  \ / archived) —\n  ◦ active_medication = warfarin 5 mg daily  [HISTORICAL]\n  ◦ active_medication\
                  \ = warfarin 5 mg daily  [SUPERSEDED]"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/get_memory:
    post:
      tags:
      - Memory
      operationId: get_memory
      summary: Get one memory by id
      description: 'Fetch one memory by its id (the `#id` shown by `list_memories`) — its value, status, scope,

        confidence, what it supersedes, and any metadata.


        **Requires capability:** `read`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "get_memory"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                memory_id:
                  type: integer
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
              required:
              - memory_id
              type: object
            example:
              memory_id: 4
              user_id: pt_4471
      responses:
        '200':
