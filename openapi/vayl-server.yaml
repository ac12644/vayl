  /v1/tools/purge_expired:
    post:
      tags:
      - Compliance
      operationId: purge_expired
      summary: Purge records older than N days (retention)
      description: 'Retention / storage-limitation (GDPR Art. 5(1)(e)): permanently delete records written more

        than `older_than_days` ago. Statements are scoped to the user/space. The optional flags extend

        the same window to the append-only tables — NOTE these are not per-user: `include_decisions` and

        `include_receipts` purge those tables for your whole tenant, and `include_audit` purges the audit

        log from the head of the chain (a signed retention anchor keeps the remaining chain verifiable).

        There is one chain per deployment, shared by every tenant, so `include_audit` is DEPLOYMENT-WIDE

        and only the deployment operator may use it.


        **Requires capability:** `admin`. **Behaviour:** destructive: erases data, idempotent.

        The same tool over MCP is `tools/call` with `"name": "purge_expired"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                older_than_days:
                  type: integer
                user_id:
                  default: default
                  type: string
                agent_id:
                  default: ''
                  type: string
                run_id:
                  default: ''
                  type: string
                include_audit:
                  default: false
                  type: boolean
                include_decisions:
                  default: false
                  type: boolean
                include_receipts:
                  default: false
                  type: boolean
              required:
              - older_than_days
              type: object
            example:
              older_than_days: 3650
              user_id: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: Purged 0 record(s) older than 3650 days.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/create_principal:
    post:
      tags:
      - Administration
      operationId: create_principal
      summary: Create a principal (user/agent) + API key
      description: 'Admin only. Create a principal (a human user, agent, or service) and issue its API key. Roles:

        admin, member, agent, viewer, auditor. The key is shown ONCE — store it securely; it can''t be

        recovered (reissue by creating a new principal).


        `scopes` is a comma-separated list of user_ids this principal may access, e.g.

        "cust_5521,cust_7788". Leave empty for unrestricted (the default, and correct for a

        single-tenant deployment). Set it for any multi-tenant deployment: without it, a valid

        key can read any space by passing that space''s user_id. An admin role is unrestricted

        regardless, since org control implies reaching every space.


        `tenant` is the org partition this key belongs to (default: the caller''s own tenant). It is a

        HARD boundary: every store query is filtered by it, so a key for one tenant cannot reach another

        tenant''s memory even under the same user_id. Set it per org in a shared multi-tenant deployment.

        Only the deployment operator (an admin of the "default" tenant) may name a different tenant.


        **Requires capability:** `admin`.

        The same tool over MCP is `tools/call` with `"name": "create_principal"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                name:
                  type: string
                role:
                  default: member
                  type: string
                kind:
                  default: agent
                  type: string
                scopes:
                  default: ''
                  type: string
                tenant:
                  default: ''
                  type: string
              required:
              - name
              type: object
            example:
              name: ward-7-assistant
              role: agent
              scopes: pt_4471
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: "Created principal prin_c61d3e3804ab 'ward-7-assistant' (role: agent, kind: agent, tenant:\
                  \ default).\n  API key (shown once — save it now):\n  vayl_sk_…"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/list_principals:
    post:
      tags:
      - Administration
      operationId: list_principals
      summary: List principals of this deployment
      description: 'Admin only. List your tenant''s principals — id, name, roles, and whether disabled (the

        deployment operator sees every tenant''s). Never shows API keys (only their hashes are stored).


        **Requires capability:** `admin`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "list_principals"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties: {}
              type: object
            example: {}
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: '• prin_d710480023f5  ops  [admin]  agent

                  • prin_c61d3e3804ab  ward-7-assistant  [agent]  agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/revoke_principal:
    post:
      tags:
      - Administration
      operationId: revoke_principal
      summary: Revoke a principal's access
      description: 'Admin only. Disable a principal — its API key stops working immediately. Irreversible

        (create a new principal to restore access). With `erase=True`, the principal row is HARD-deleted

        (Art. 17 for team members) instead of retained as disabled. A tenant admin can only revoke its

        own tenant''s principals; another tenant''s id reads as unknown.


        **Requires capability:** `admin`. **Behaviour:** destructive: erases data, idempotent.

        The same tool over MCP is `tools/call` with `"name": "revoke_principal"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                principal_id:
                  type: string
                erase:
                  default: false
                  type: boolean
              required:
              - principal_id
              type: object
            example:
              principal_id: prin_c61d3e3804ab
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: Revoked prin_c61d3e3804ab — its API key no longer works.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/license_status:
    post:
      tags:
      - Administration
      operationId: license_status
      summary: Show the license / edition status
      description: 'Show the deployment''s edition and entitlements — Community or a licensed edition, seats used
        vs

        allowed, expiry, and unlocked features. If a license was rejected (tampered/expired/wrong key),

        this says so and reports the Community fallback it''s running under.


        **Requires capability:** `verify`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "license_status"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties: {}
              type: object
            example: {}
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: "Community edition — up to 3 principals. No license installed.\n  principals in use: 1 /\
                  \ 3"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/tools/stats:
