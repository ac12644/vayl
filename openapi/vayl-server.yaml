  /v1/tools/health:
    post:
      tags:
      - Administration
      operationId: health
      summary: Health check
      description: 'Check that Vayl is configured and its dependencies are reachable — database, embedder,

        LLM, and graph (if enabled). Run this to diagnose setup before relying on memory; it makes

        one small LLM/embed call, so it costs a few tokens.


        **Requires capability:** `verify`. **Behaviour:** read-only.

        The same tool over MCP is `tools/call` with `"name": "health"`.'
      security:
      - apiKey: []
      - oidc: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              properties: {}
              type: object
            example: {}
      responses:
        '200':
          description: The tool ran. `result` is its text reply.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolResult'
              example:
                result: 'config: LLM_PROVIDER=openai, model=gpt-6-luna

                  license: community

                  encryption: on · signing: on

                  db: ok

                  embedder: ok

                  llm: ok

                  graph: disabled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/InvalidArguments'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: vayl_sk_…
      description: An API key created with the `create_principal` tool. Shown once; only its hash is stored.
    oidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'An OIDC ID token (RS256), verified against `VAYL_OIDC_JWKS_URL` with `iss`, `aud` and `exp`

        required. Needs an Enterprise license granting `sso` and `pip install "vayl-mcp[sso]"`.

        '
    metricsToken:
      type: http
      scheme: bearer
      description: The value of `VAYL_METRICS_TOKEN`, when set.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: 'Correlation ID. Reused if it is 1–64 characters of `A-Z a-z 0-9 . _ : -` (so proxy and Vayl

        logs line up); otherwise replaced with a generated one. Echoed on the response and stamped on

        every log line written while serving the request.

        '
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._:-]{1,64}$
        example: req-123
  headers:
    RequestId:
      description: The request's correlation ID (the incoming one if it was valid, otherwise generated).
      schema:
        type: string
        example: req-123
  schemas:
    JsonRpcRequest:
      type: object
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          const: '2.0'
        id:
          description: Request id, echoed in the response. Omit for a notification.
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
          description: The MCP method, for example `initialize`, `tools/list` or `tools/call`.
          example: tools/call
        params:
          type: object
          description: 'Method parameters. For `tools/call`: `{"name": <tool>, "arguments": {…}}`.'
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
          description: For `422`, which argument is wrong and why.
    ToolResult:
      type: object
      required:
      - result
      properties:
        result:
          type: string
          description: The tool's reply, the same text an MCP `tools/call` returns.
    ToolList:
      type: object
      properties:
        tools:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              title:
                type:
                - string
                - 'null'
              description:
                type: string
              input_schema:
                type: object
                description: JSON Schema for the tool's arguments.
  responses:
    Unauthorized:
      description: No credential, or one that doesn't resolve to an active principal.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: 'unauthorized: send Authorization: Bearer vayl_sk_...'
    Forbidden:
      description: 'The key''s role lacks the tool''s capability, or the `user_id` is outside the key''s scopes.
        The

        denial is recorded in the audit log.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ToolResult'
          example:
            result: 'Access denied: ''create_principal'' requires the ''admin'' capability; your role(s) [''agent'']
              do not grant it.'
    InvalidArguments:
      description: An argument is missing, unknown or the wrong type for the tool's schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid arguments
            detail: "1 validation error for call[remember]\ntext\n  Missing required argument [type=missing_argument,\
              \ input_value={}, input_type=dict]"
    TooLarge:
      description: The body is larger than `VAYL_MAX_BODY`, whether declared or chunked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: request body too large
    RateLimited:
      description: This client IP exceeded `VAYL_RATE_PER_MIN` in the last minute (per server process).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate limit exceeded
