[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vayl-mcp"
version = "0.8.1"
description = "Vayl — the reconciling memory layer for AI agents, over MCP. Remembers what's true now, forgets correctly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Abhishek Chauhan", email = "ac12644@gmail.com" }]
keywords = ["mcp", "memory", "agents", "llm", "reconciliation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=4.1,<5",   # standalone FastMCP framework; fastmcp 4 builds on MCP SDK v2
    "mcp>=2.3,<3",       # imported directly: mcp.types.ToolAnnotations and the Python client (vayl.Vayl)
    "cryptography>=50",   # at-rest encryption + Argon2id VAYL_KEY KDF; 50 fixes PYSEC-2026-3552
]

[project.urls]
Homepage = "https://github.com/ac12644/vayl"
Documentation = "https://vayl.gitbook.io/vayl-docs"
Repository = "https://github.com/ac12644/vayl"
Issues = "https://github.com/ac12644/vayl/issues"

[project.optional-dependencies]
# Optional Neo4j graph projection for deep multi-hop / relational queries.
graph = ["neo4j>=5"]
# Remote HTTP transport (vayl-server): a team-shareable, authenticated MCP endpoint.
# starlette, httpx2 and uvicorn come transitively via `mcp`; the extra keeps uvicorn explicit.
server = ["uvicorn>=0.30"]
# OIDC SSO (M5): verify IdP-issued ID tokens (JWT/RS256). cryptography is already a core dep.
sso = ["pyjwt>=2.13.0"]   # <2.4 is affected by CVE-2022-29217 (JWT algorithm confusion)
# Postgres backend (M6): concurrent multi-writer storage for scale (foundation; validate live).
postgres = ["psycopg[binary]>=3.1"]
# HTTP connection pooling for the LLM/embedding endpoint — reuses keep-alive connections instead of
# a fresh TCP+TLS handshake per call (~50-200ms/request). Optional: without it, urllib is used and
# only the pooling is lost, so the core stays at two dependencies.
pooled = ["urllib3>=2"]
# Framework adapters: expose Vayl as reconciling memory tools for popular Python agent frameworks
# (see vayl.integrations.*). Each is optional and imported lazily.
#   langgraph: langchain-core builds the tools; langchain (v1) provides the `create_agent` factory the
#   agent() helper prefers; langgraph is the pre-v1 create_react_agent fallback.
langgraph = ["langchain-core>=1.5.3", "langchain>=1", "langgraph>=1.2.10"]
openai-agents = ["openai-agents>=0.1"]      # @function_tool + Agent/Runner
crewai = ["crewai>=1"]                        # crewai.tools @tool + Agent (v1 memory API)
# Dev tooling: offline unit tests + lint (what CI runs). langchain-core and openai-agents are here so
# those adapters' tools are actually exercised in CI (not just skipped). crewai stays out — it's a heavy
# install (vector DBs, litellm); its tools are verified locally, and an import-safety test guards the
# module in CI regardless. Framework agent() helpers are thin passthroughs covered by their missing-dep path.
dev = ["pytest>=8", "ruff>=0.16.1", "mypy>=1.10", "pyyaml>=6", "langchain-core>=1.5.3", "openai-agents>=0.1"]

[project.scripts]
vayl-demo = "vayl.demo:main"                          # zero-setup 30s demo of reconciling memory
vayl-mcp = "vayl.cli:mcp"
vayl-server = "vayl.cli:server"
vayl-migrate = "vayl.storage.migrations:main"            # schema status / apply pending migrations
vayl-license = "vayl.licensing.mint_license:main"   # vendor-side: keygen + mint customer licenses

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vayl.presets" = ["*.json"]      # bundle the built-in slot-schema presets in the wheel

[tool.pytest.ini_options]
# Unit tests are offline and deterministic (no LLM/network). The LLM evals live
# in benchmarks/ and are run manually — they are not part of the test suite.
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
# Benchmarks/research are exploratory scripts, not held to lint.
extend-exclude = ["benchmarks", "research"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear (likely bugs), UP pyupgrade (py3.10+ idioms)
select = ["E", "F", "W", "I", "B", "UP"]
# The codebase uses a deliberately compact one-liner style (semicolons, grouped
# imports, single-line ifs). We keep the real checks (unused imports/vars via F,
# whitespace via W, import order via I) and drop the purely-stylistic ones.
ignore = ["E501", "E701", "E702", "E401", "E741"]

[tool.mypy]
python_version = "3.10"
files = ["src/vayl"]
# check the bodies of unannotated functions too — that is where most of this codebase lives
check_untyped_defs = true
# optional extras (neo4j, langchain, crewai, …) are not installed in every environment
ignore_missing_imports = true
