name: release

# Publish to PyPI on a version tag (e.g. `v0.1.0`), via PyPI Trusted Publishing
# (OIDC — no stored API tokens). The tag drives the release; PyPI verifies the
# workflow identity. Configure the trusted publisher once at
# https://pypi.org/manage/project/vayl-mcp/settings/publishing/
# (owner: vayl-dev, repo: vayl, workflow: release.yml, environment: pypi).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.5.0
          python -m build
      - name: Validate metadata
        run: |
          python -m pip install twine==7.0.0
          python -m twine check dist/*
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')
          echo "tag=$tag built=$built"
          test "$tag" = "$built" || { echo "::error::tag v$tag does not match package version $built"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The GitHub environment must match the one set on the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/vayl-mcp/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
